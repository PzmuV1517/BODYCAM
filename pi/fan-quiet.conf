# BODYCAM quiet fan curve (Pi 5 active cooler). Temps in millidegrees C, speed 0-255.
# Off below 65C, gentle until 78C, full only at 82C (Pi throttles at 85C).
dtparam=fan_temp0=65000
dtparam=fan_temp0_hyst=5000
dtparam=fan_temp0_speed=60
dtparam=fan_temp1=72000
dtparam=fan_temp1_hyst=5000
dtparam=fan_temp1_speed=90
dtparam=fan_temp2=78000
dtparam=fan_temp2_hyst=4000
dtparam=fan_temp2_speed=150
dtparam=fan_temp3=82000
dtparam=fan_temp3_hyst=3000
dtparam=fan_temp3_speed=255
